<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReservaHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo"><h2>ReservaHub</h2></div>
    <nav>
        <a href="index.html">Início</a>
        <a href="usuarios.html">Usuários</a>
        <a id="navAnunciar" href="anunciar.html" style="display:none">Anunciar</a>
        <a href="reservas.html">Minhas Reservas</a>
        <a id="navLogin" href="login.html" class="btn-login">Entrar</a>
        <span id="navUsuario" style="display:none; align-items:center; gap:10px;">
            <span style="color:#cbd5e1">Olá, <strong id="navNome"></strong></span>
            <a href="#" class="btn-login" onclick="logout()">Sair</a>
        </span>
    </nav>
</header>

<section class="hero">
    <div class="search-container">
        <div class="search-group">
            <label>LOCALIZAÇÃO</label>
            <input type="text" id="filtroLocal" placeholder="Para onde você vai?">
        </div>
        <div class="search-group">
            <label>TIPO DE USO</label>
            <select id="filtroTipo">
                <option value="">Todos</option>
                <option value="res">Residencial</option>
                <option value="corp">Corporativo</option>
            </select>
        </div>
        <button class="btn-search" onclick="carregarImoveis()">Buscar agora</button>
    </div>
</section>

<main class="container">
    <h3 class="section-title">Imóveis Disponíveis</h3>
    <div class="grid" id="imoveis-grid"></div>
</main>

<script src="script.js"></script>
</body>
</html>
